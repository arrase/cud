[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "cud"
version = "0.5.5"
description = "Local multi-agent framework for Ollama, LangGraph, Deep Agents, and Discord."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Cud contributors" }]
dependencies = [
  "deepagents>=0.7.32",
  "discord.py>=2.7.1",
  "langchain>=1.4.7",
  "langchain-core>=1.7.0",
  "langchain-mcp-adapters>=0.3.2",
  "langchain-ollama>=1.1.0",
  "langgraph>=1.2.17",
  "langgraph-checkpoint-sqlite>=3.1.2",
  "aiosqlite>=0.22.1",
  "pydantic>=2.14.1",
  "croniter>=6.2.4",
  "pyyaml>=6.0.3",
  "rich>=15.0.0",
  "prompt_toolkit>=3.0.53",
  "PySide6>=6.12.0",
]

[project.scripts]
cud = "cud.cli:main"
cud-gui = "cud.gui:main"

[project.optional-dependencies]
dev = [
  "ruff>=0.17.2",
  "mypy>=2.4.0",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "anyio>=4.15.1",
]
test = [
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "anyio>=4.15.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cud"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/pyproject.toml",
  "/README.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
addopts = "--strict-markers --strict-config"

[tool.coverage.run]
source = ["cud"]
relative_files = true
branch = true
omit = [
  "src/cud/gui/*",
]

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "N", "A", "B", "C4", "S", "UP", "SIM", "RUF", "PTH", "PIE",
  "RET", "PERF", "ASYNC", "LOG", "G", "T20", "PL",
  "C90", "BLE", "TRY", "RSE", "ARG", "ERA", "FIX", "TD", "FURB", "PGH", "SLF",
  "FBT", "DTZ", "PT", "ANN",
]
ignore = [
  # RUF001: the UI deliberately uses emoji and typographic glyphs (➕, ❯, …).
  "RUF001",
  # Module-level runtime state is intentional.
  "PLW0603",
  # Cheap path metadata calls (resolve/exists) in async handlers are not worth offloading to threads.
  "ASYNC240",
  # Descriptive messages in standard exceptions are idiomatic without custom exception subclasses.
  "TRY003",
  # ValueError is the uniform domain validation error for persisted YAML and config payloads.
  "TRY004",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 11
max-positional-args = 5

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "SLF001", "PLR2004", "PT011"]
# Qt method overrides use camelCase (e.g. sizeHint).
"src/cud/gui/**" = ["N802"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
warn_unreachable = true
ignore_missing_imports = true
show_error_codes = true
show_column_numbers = true

[[tool.mypy.overrides]]
# Tests use idiomatic pytest monkeypatching (rebinding module attributes) and
# hand-rolled fakes, which are not library-grade typing problems.
module = "tests.*"
disallow_untyped_defs = false
warn_unused_ignores = false
disable_error_code = ["method-assign", "arg-type", "assignment", "misc", "union-attr"]


