[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "cud"
version = "0.4.1"
description = "Local multi-agent framework for Ollama, LangGraph, Deep Agents, and Discord."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Cud contributors" }]
dependencies = [
  "deepagents>=0.6.3",
  "discord.py>=2.7.1",
  "langchain>=1.3.1",
  "langchain-core>=1.4.0",
  "langchain-mcp-adapters>=0.2.2",
  "langchain-ollama>=1.1.0",
  "langgraph>=1.2.1",
  "langgraph-checkpoint-sqlite>=3.1.0",
  "aiosqlite>=0.21.0",
  "pydantic>=2.13.3",
  "croniter>=5.0.1",
  "pyyaml>=6.0.3",
  "rich>=15.0.0",
  "prompt_toolkit>=3.0.0",
  "PySide6>=6.5.0",
]

[project.scripts]
cud = "cud.cli:main"
cud-gui = "cud.gui:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cud"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/pyproject.toml",
  "/README.md",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

