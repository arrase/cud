[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "cud"
version = "0.5.3"
description = "Local multi-agent framework for Ollama, LangGraph, Deep Agents, and Discord."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Cud contributors" }]
dependencies = [
  "deepagents>=0.7.19",
  "discord.py>=2.7.1",
  "langchain>=1.4.2",
  "langchain-core>=1.6.5",
  "langchain-mcp-adapters>=0.3.2",
  "langchain-ollama>=1.1.0",
  "langgraph>=1.2.12",
  "langgraph-checkpoint-sqlite>=3.1.1",
  "aiosqlite>=0.22.1",
  "pydantic>=2.13.5",
  "croniter>=6.2.4",
  "pyyaml>=6.0.3",
  "rich>=15.0.0",
  "prompt_toolkit>=3.0.53",
  "PySide6>=6.11.2",
]

[project.scripts]
cud = "cud.cli:main"
cud-gui = "cud.gui:main"

[project.optional-dependencies]
test = [
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cud"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/pyproject.toml",
  "/README.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["cud"]
relative_files = true
omit = [
  "src/cud/gui/*",
]

[tool.coverage.report]
show_missing = true


