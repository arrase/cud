[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "cud"
version = "0.5.4"
description = "Local multi-agent framework for Ollama, LangGraph, Deep Agents, and Discord."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Cud contributors" }]
dependencies = [
  "deepagents>=0.7.19",
  "discord.py>=2.7.1",
  "langchain>=1.4.2",
  "langchain-core>=1.6.5",
  "langchain-mcp-adapters>=0.3.2",
  "langchain-ollama>=1.1.0",
  "langgraph>=1.2.12",
  "langgraph-checkpoint-sqlite>=3.1.1",
  "aiosqlite>=0.22.1",
  "pydantic>=2.13.5",
  "croniter>=6.2.4",
  "pyyaml>=6.0.3",
  "rich>=15.0.0",
  "prompt_toolkit>=3.0.53",
  "PySide6>=6.11.2",
]

[project.scripts]
cud = "cud.cli:main"
cud-gui = "cud.gui:main"

[project.optional-dependencies]
dev = [
  "ruff>=0.16.9",
  "mypy>=2.3.1",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "anyio>=4.15.1",
]
test = [
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "anyio>=4.15.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cud"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/pyproject.toml",
  "/README.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
addopts = "--strict-markers --strict-config"

[tool.coverage.run]
source = ["cud"]
relative_files = true
omit = [
  "src/cud/gui/*",
]

[tool.coverage.report]
show_missing = true
branch = true
fail_under = 90

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# E/W/F: pycodestyle + pyflakes.  B: bugbear (loop-variable capture, bare
# excepts).  I: import order.  UP: pyupgrade for the declared 3.11 floor.
select = ["E", "F", "W", "B", "I", "UP", "C4", "RUF"]
ignore = [
  # RUF001: the UI deliberately uses emoji and typographic glyphs (➕, ❯, …).
  "RUF001",
]

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
show_error_codes = true
show_column_numbers = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_reexport = false

[[tool.mypy.overrides]]
# Tests use idiomatic pytest monkeypatching (rebinding module attributes) and
# hand-rolled fakes, which are not library-grade typing problems.
module = "tests.*"
disallow_untyped_defs = false
warn_unused_ignores = false
disable_error_code = ["method-assign", "arg-type", "assignment", "misc", "union-attr"]


