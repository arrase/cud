[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "cud"
version = "0.1.0"
description = "Local multi-agent framework for Ollama, LangGraph, Deep Agents, and Discord."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Cud contributors" }]
dependencies = [
  "deepagents>=0.5.6",
  "discord.py>=2.7.1",
  "langchain>=1.2.17",
  "langchain-core>=1.3.2",
  "langchain-mcp-adapters>=0.2.2",
  "langchain-ollama>=1.1.0",
  "langgraph>=1.1.10",
  "langgraph-checkpoint-sqlite>=3.0.3",
  "pydantic>=2.13.3",
  "pyyaml>=6.0.3",
  "rich>=15.0.0",
]

[project.scripts]
cud = "cud.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cud"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/pyproject.toml",
  "/README.md",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

